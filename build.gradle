plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archive_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        redfoxexpand {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.register('compileReactiveJava8', JavaCompile) {
    description = 'Verifies that the Minecraft-independent Schema v3 reactive core remains Java 8 source-compatible.'
    source = fileTree('src/main/java') {
        include 'redfoxexpand/reactive/**/*.java'
    }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/reactiveJava8')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn tasks.named('compileReactiveJava8')
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
