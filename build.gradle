buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        maven { url 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

plugins {
    id 'java'
}

apply plugin: 'forge'

version = '0.1.0'
group = 'redfoxexpand'
archivesBaseName = 'RedFoxExpand-1.7.10'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
    mappings = 'stable_12'
}

// ForgeGradle 1.2 hard-codes retired S3 endpoints. Keep the legacy toolchain
// reproducible by redirecting version metadata and game binaries to Mojang's
// official content-addressed launcher endpoints.
afterEvaluate {
    tasks.getVersionJson.url = new net.minecraftforge.gradle.delayed.DelayedString(
        project,
        'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json'
    )
    tasks.downloadClient.url = new net.minecraftforge.gradle.delayed.DelayedString(
        project,
        'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar'
    )
    tasks.downloadServer.url = new net.minecraftforge.gradle.delayed.DelayedString(
        project,
        'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar'
    )
}

repositories {
    maven { url 'https://repo.spongepowered.org/maven' }
    mavenCentral()
}

configurations {
    shade
    compile.extendsFrom(shade)
}

dependencies {
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version, mcversion: project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

def generatedMixinResources = file("$buildDir/generated-resources/mixin")
sourceSets.main.resources.srcDir generatedMixinResources

compileJava {
    dependsOn genSrgs
    doFirst {
        generatedMixinResources.mkdirs()
        file("$buildDir/tmp/mixins").mkdirs()
    }
    options.compilerArgs += [
        "-AreobfSrgFile=${tasks.genSrgs.mcpToSrg}",
        "-AreobfNotchSrgFile=${tasks.genSrgs.mcpToNotch}",
        "-AoutSrgFile=${file("$buildDir/tmp/mixins/mixins.redfoxexpand.srg")}",
        "-AoutNotchSrgFile=${file("$buildDir/tmp/mixins/mixins.redfoxexpand.notch.srg")}",
        "-AoutRefMapFile=${file("$generatedMixinResources/mixins.redfoxexpand.refmap.json")}",
        '-AdisableTargetValidator=true'
    ]
}

// Mixin AP writes mappings for members declared by the mixin itself (not only
// target selectors in the refmap). ForgeGradle 1.2 must receive this file or
// @Shadow members keep MCP names and fail against an SRG production client.
tasks.reobf {
    dependsOn compileJava
    addExtraSrgFile file("$buildDir/tmp/mixins/mixins.redfoxexpand.srg")
}

jar {
    from {
        configurations.shade.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest.attributes(
        'FMLCorePlugin': 'redfoxexpand.mixin.RedFoxExpandMixinLoader',
        'ForceLoadAsMod': true,
        'FMLCorePluginContainsFMLMod': true,
        'ModSide': 'CLIENT',
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'TweakOrder': 0,
        'MixinConfigs': 'mixins.redfoxexpand.json'
    )
}

task prepareRelease(type: Copy, dependsOn: build) {
    description = 'Copies the verified, reobfuscated distribution JAR into release/.'
    group = 'distribution'
    from "$buildDir/libs/${archivesBaseName}-${version}.jar"
    into "$projectDir/release"
}
